<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Board</title>
    <link rel="stylesheet" href="../style.css">
</head>

<body>
    <header>
        <div class="moon-container">
            <div class="crescent-moon"></div>
            <div class="star star1"></div>
            <div class="star star2"></div>
            <div class="star star3"></div>
        </div>
        Task Board
    </header>

    <div class="wrapper">
        <div class="create-task-panel">
            <h2>New Task</h2>
            <div class="input-container">
                <input type="text" class="task-field" placeholder="Task name..." />
                <button class="create-btn">Add</button>
            </div>
        </div>

        <div class="board-columns">
            <div class="column">
                <div class="column-title pending">Backlog</div>
                <ul class="items-list">
                    <li class="task-card">Learn HTML</li>
                    <li class="task-card">Practice CSS</li>
                    <li class="task-card">Understand Git</li>
                </ul>
            </div>

            <div class="column">
                <div class="column-title active">In Progress</div>
                <ul class="items-list">
                    <li class="task-card">Read JavaScript docs</li>
                    <li class="task-card">Build mini project</li>
                </ul>
            </div>

            <div class="column">
                <div class="column-title completed">Completed</div>
                <ul class="items-list">
                    <li class="task-card">Install VS Code</li>
                    <li class="task-card">Set up GitHub</li>
                </ul>
            </div>

            <div class="column">
                <div class="column-title deleted">Trash</div>
                <ul class="items-list">
                    <li class="task-card">Watch Netflix</li>
                    <li class="task-card">Scroll Instagram</li>
                </ul>
                <button class="empty-btn">Empty</button>
            </div>
        </div>
    </div>
</body>

</html>
